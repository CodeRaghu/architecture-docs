<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Design Documents</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; max-width: 960px; margin: 0 auto; padding: 2rem 16px; color: #24292f; background: #fff; }
        nav { font-size: 0.9rem; padding-bottom: 0.75rem; margin-bottom: 1rem; border-bottom: 1px solid #d0d7de; }
        nav a { margin-right: 1rem; }
        a { color: #0969da; }
        img { max-width: 100%; height: auto; border: 1px solid #d0d7de; border-radius: 6px; margin-top: 1rem; }
        pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow: auto; }
        pre.mermaid { background: none; text-align: center; }
        table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1rem 0; }
        th, td { border: 1px solid #d0d7de; padding: 6px 12px; text-align: left; vertical-align: top; }
        th { background: #f6f8fa; }
        blockquote { color: #57606a; border-left: 4px solid #d0d7de; margin: 0; padding: 0 1rem; }
    </style>
</head>
<body>
    <nav>
        <a href="#docs/index.md">Home</a>
        <a href="#docs/delivery/TODO.md">TODO</a>
        <a href="#docs/delivery/delivery-plan.md">Delivery</a>
        <a href="#docs/setup/development-setup.md">Setup</a>
        <a href="#docs/requirements/README.md">Requirements</a>
        <a href="#docs/screens/README.md">Screens</a>
        <a href="#docs/testing/test-strategy.md">Testing</a>
        <a href="#docs/architecture/README.md">Architecture</a>
    </nav>
    <div id="content">Loading documentation...</div>
    <script>
        // Renders any Markdown file in the repo: index.html#docs/path/file.md#optional-heading
        const REPO_URL = "https://github.com/CodeRaghu/architecture-docs/tree/main/";
        mermaid.initialize({ startOnLoad: false });

        const slug = text => text.toLowerCase().trim().replace(/[^\w\s-]/g, "").replace(/\s/g, "-");

        function resolve(base, rel) {
            const parts = base.split("/").slice(0, -1);
            for (const seg of rel.split("/")) {
                if (seg === "..") parts.pop();
                else if (seg && seg !== ".") parts.push(seg);
            }
            return parts.join("/");
        }

        async function render() {
            const [page, anchor] = (location.hash.slice(1) || "docs/index.md").split("#");
            const content = document.getElementById("content");
            try {
                const response = await fetch(page);
                if (!response.ok) throw new Error(response.status);
                content.innerHTML = marked.parse(await response.text());
            } catch (err) {
                content.innerHTML = `<h1>Documentation Load Error</h1><p>Could not load ${page}.</p>`;
                return;
            }

            content.querySelectorAll("h1, h2, h3, h4").forEach(h => { h.id = slug(h.textContent); });

            content.querySelectorAll("img").forEach(img => {
                const src = img.getAttribute("src");
                if (!/^(https?:|\/)/.test(src)) img.src = resolve(page, src);
            });

            content.querySelectorAll("a[href]").forEach(a => {
                const href = a.getAttribute("href");
                if (/^(https?:|mailto:)/.test(href)) return;
                if (href.startsWith("#")) { a.href = `#${page}${href}`; return; }
                const [path, hash] = href.split("#");
                const target = resolve(page, path);
                if (target.endsWith(".md")) a.href = `#${target}${hash ? "#" + hash : ""}`;
                else a.href = REPO_URL + target;
            });

            content.querySelectorAll("pre > code.language-mermaid").forEach(code => {
                const pre = code.parentElement;
                pre.className = "mermaid";
                pre.textContent = code.textContent;
            });
            await mermaid.run({ querySelector: "pre.mermaid" });

            const target = anchor && document.getElementById(anchor);
            if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
        }

        window.addEventListener("hashchange", render);
        render();
    </script>
</body>
</html>
