<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Design Documents</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 2rem; color: #24292f; }
        img { max-width: 100%; height: auto; border: 1px solid #d0d7de; border-radius: 6px; margin-top: 1rem; }
        pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow: auto; }
    </style>
</head>
<body>
    <div id="content">Loading documentation...</div>
    <script>
        // Dynamically fetch and render the index.md content natively in the browser
        fetch('./docs/index.md')
            .then(response => response.text())
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = "<h1>Documentation Load Error</h1><p>Could not load docs/index.md configuration.</p>";
            });
    </script>
</body>
</html>
